<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دعوتنامه عروسی</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{
  background:radial-gradient(circle at center,#eadfd3 0,#b9a99a 100%);
  color:#2d251f; overflow-x:hidden;
}
.screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px; transition:opacity .8s ease,transform .8s ease;
}
.hidden{display:none!important}
.envelope-screen{background:linear-gradient(145deg,#d9c9b8,#f5eee6)}
.envelope-wrap{text-align:center}
.envelope{
  position:relative;width:min(86vw,360px);height:235px;margin:auto;
  cursor:pointer;filter:drop-shadow(0 15px 20px rgba(0,0,0,.22));
  perspective:900px;
}
.env-back,.env-front{
  position:absolute;inset:0;border-radius:8px;
}
.env-back{background:#efe3d5}
.env-front{
  background:#e5d3c0;
  clip-path:polygon(0 0,50% 53%,100% 0,100% 100%,0 100%);
  z-index:3;
}
.env-flap{
  position:absolute;left:0;top:0;width:100%;height:100%;
  background:#f4e9dd;clip-path:polygon(0 0,100% 0,50% 55%);
  transform-origin:top center;z-index:4;transition:transform 1s ease;
}
.envelope.open .env-flap{transform:rotateX(180deg)}
.seal{
  position:absolute;z-index:5;left:50%;top:49%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;background:#b89a78;color:white;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 4px 10px #0003;transition:opacity .5s
}
.envelope.open .seal{opacity:0}
.open-text{margin-top:24px;font-size:17px;color:#51453a}
.hint{font-size:12px;color:#776b60;margin-top:8px}

.card-screen{
  flex-direction:column;justify-content:flex-start;padding:18px 12px 35px;
  background:linear-gradient(180deg,#efe7df,#d9cabc);
}
.card-box{
  width:min(94vw,560px); border-radius:20px; overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.25); background:#eee4d9;
  animation:cardIn 1.1s ease both;
}
.card-box img{display:block;width:100%;height:auto}
@keyframes cardIn{
  from{opacity:0;transform:scale(.92) translateY(25px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.options{width:min(94vw,560px);margin-top:15px;display:grid;gap:10px}
.option{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:10px 14px;border-radius:13px;
  text-decoration:none;color:#4b3d31;background:rgba(255,255,255,.72);
  box-shadow:0 3px 12px #00000014;font-size:14px;
}
.countdown{
  width:min(94vw,560px);margin-top:12px;padding:14px;
  border-radius:15px;background:rgba(255,255,255,.72);text-align:center;
}
.count-title{font-size:13px;margin-bottom:8px;color:#6b5a4b}
.timer{display:flex;direction:rtl;justify-content:center;gap:7px}
.unit{min-width:65px;background:#f6efe8;border-radius:10px;padding:8px 5px}
.num{display:block;font-size:21px;font-weight:bold}
.lbl{display:block;font-size:10px;color:#78695c;margin-top:2px}
.music{
  position:fixed;left:12px;bottom:12px;z-index:20;width:42px;height:42px;
  border:0;border-radius:50%;background:#ffffffd9;box-shadow:0 3px 12px #0003;
  font-size:18px;cursor:pointer
}
.small-note{text-align:center;font-size:10px;color:#76685c;margin-top:9px}
</style>
</head>
<body>

<section id="envelopeScreen" class="screen envelope-screen">
  <div class="envelope-wrap">
    <div id="envelope" class="envelope" role="button" aria-label="باز کردن دعوتنامه">
      <div class="env-back"></div>
      <div class="env-flap"></div>
      <div class="env-front"></div>
      <div class="seal">♥</div>
    </div>
    <div class="open-text">برای مشاهده دعوتنامه، پاکت را باز کنید</div>
    <div class="hint">روی پاکت بزنید</div>
  </div>
</section>

<section id="cardScreen" class="screen card-screen hidden">
  <div class="card-box">
    <img src="wedding_card.jpg" alt="کارت دعوت عروسی">
  </div>

  <div class="options">
    <!-- این لینک را با لینک دقیق Google Maps تالار جایگزین کنید -->
    <a class="option" href="https://google.com/maps/place/باغ+تالار+پارمیس%E2%80%AD/data=!4m2!3m1!1s0x0:0x1ba75c8d9795a072?sa=X&ved=1t:2428&ictx=111" target="_blank" rel="noopener">
      📍 مشاهده لوکیشن مراسم روی Google Maps
    </a>
  </div>

  <div class="countdown">
    <div class="count-title">تا شروع مراسم</div>
    <div id="timer" class="timer">
      <div class="unit"><span id="days" class="num">--</span><span class="lbl">روز</span></div>
      <div class="unit"><span id="hours" class="num">--</span><span class="lbl">ساعت</span></div>
      <div class="unit"><span id="minutes" class="num">--</span><span class="lbl">دقیقه</span></div>
      <div class="unit"><span id="seconds" class="num">--</span><span class="lbl">ثانیه</span></div>
    </div>
  </div>

  <div class="small-note">در صورت تمایل می‌توانید موسیقی را از دکمه پایین صفحه متوقف کنید.</div>
</section>

<audio id="music" src="wedding_music.mp3" loop preload="auto"></audio>
<button id="musicBtn" class="music hidden" aria-label="پخش یا توقف موسیقی">🔊</button>

<script>
const envelope = document.getElementById('envelope');
const envelopeScreen = document.getElementById('envelopeScreen');
const cardScreen = document.getElementById('cardScreen');
const music = document.getElementById('music');
const musicBtn = document.getElementById('musicBtn');

envelope.addEventListener('click', async () => {
  envelope.classList.add('open');
  setTimeout(() => {
    envelopeScreen.classList.add('hidden');
    cardScreen.classList.remove('hidden');
    musicBtn.classList.remove('hidden');
    music.play().catch(()=>{});
  }, 950);
});

musicBtn.addEventListener('click', async () => {
  if (music.paused) {
    await music.play().catch(()=>{});
    musicBtn.textContent = '🔊';
  } else {
    music.pause();
    musicBtn.textContent = '🔇';
  }
});

// کارت: 29 مهر 1405، ساعت 18:00
// معادل 21 October 2026, 18:00 به وقت ایران.
// اگر ساعت مراسم را تغییر دادید، فقط این مقدار را عوض کنید.
const weddingDate = new Date('2026-10-21T18:00:00+03:30').getTime();

function updateCountdown(){
  const diff = weddingDate - Date.now();
  if(diff <= 0){
    document.getElementById('timer').innerHTML =
      '<div style="font-weight:bold;font-size:18px">مراسم آغاز شده است ❤️</div>';
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('days').textContent=d;
  document.getElementById('hours').textContent=h;
  document.getElementById('minutes').textContent=m;
  document.getElementById('seconds').textContent=s;
}
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
